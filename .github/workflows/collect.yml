name: Сбор выдачи WB

on:
  schedule:
    # Каждый час в HH:05 UTC (HH:05 по Москве + 3 ч). GitHub может запускать с задержкой в несколько минут.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      top_n:
        description: "Глубина выдачи (top_n)"
        default: "200"
      limit:
        description: "Только первые N запросов (пусто — все 70). Для проверки."
        default: ""
      publish:
        description: "Публиковать базу в ветку data"
        type: boolean
        default: true

# Сборы идут строго по одному: следующий ждёт окончания предыдущего, чтобы не потерять данные.
concurrency:
  group: wb-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WB_TOP_N: ${{ github.event.inputs.top_n || '200' }}
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-collector.txt

      - name: Зависимости
        run: pip install -r requirements-collector.txt

      - name: Кэш браузера Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-collector.txt') }}

      - name: Chromium
        run: python -m playwright install --with-deps chromium

      - name: Скачать базу из ветки data
        run: python -m wb_serp.publish pull

      - name: Сбор выдачи
        run: python -m wb_serp.collect ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Опубликовать базу в ветку data
        # Публикуем и после частично неудачного сбора: собранное не должно пропасть.
        if: ${{ !cancelled() && hashFiles('data/serp.db') != '' && github.event.inputs.publish != 'false' }}
        run: python -m wb_serp.publish push

      - name: Итог
        if: always()
        run: |
          python - <<'PY'
          import sqlite3, os
          if os.path.exists("data/serp.db"):
              c = sqlite3.connect("data/serp.db")
              r = c.execute("SELECT id, status, queries_ok, queries_total, items_total, started_at FROM runs ORDER BY id DESC LIMIT 1").fetchone()
              line = f"Сбор #{r[0]}: {r[1]}, запросов {r[2]}/{r[3]}, товаров {r[4]}, старт {r[5]} UTC"
              print(line)
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(line + "\n")
          PY
